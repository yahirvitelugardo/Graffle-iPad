name: GraffleiPad
options:
  bundleIdPrefix: mx.graffle
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  Graffle:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
      - path: Shim
      - path: Canvas
      - path: UI
      - path: Resources
      # Shared with the Mac app (portable core)
      - path: Core
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Graffle
        UILaunchScreen: {}
        UIDeviceFamily: [2]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: mx.graffle.diagram
            UTTypeDescription: Graffle Diagram
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [graf]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Graffle Diagram
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [mx.graffle.diagram]
          - CFBundleTypeName: SVG Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.svg-image]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.graffle.ipad
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
